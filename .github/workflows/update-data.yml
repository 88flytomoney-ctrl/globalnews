name: Update Data

on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: globalnews-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Data Layer ──────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance feedparser -q

      - name: Run data fetcher
        run: python scripts/fetch_data.py

      - name: Verify JSON output
        run: |
          python -c "
          import json
          with open('public/data/feed.json') as f:
              data = json.load(f)
          print(f'Generated: {data[\"generatedAt\"]}')
          print(f'Assets: {len(data[\"assets\"])}')
          print(f'News items: {len(data[\"news\"])}')
          for a in data['assets']:
              print(f\"  {a['name']}: {a['pctChange']:+.2f}%\")
          "

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/
          if ! git diff --staged --quiet; then
            git fetch origin master --depth=1
            git reset --soft origin/master
            git add public/data/
            git commit -m "🤖 Auto-update data $(date +%Y-%m-%d\ %H:%M)"
            git push origin HEAD:master
          else
            echo "No changes to commit"
          fi

      # ── Frontend Build & Deploy ─────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
